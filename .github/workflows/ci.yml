name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR makes the in-flight run obsolete; cancelling keeps queue
# times short and stops contributors reading stale results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches the pnpm store, keyed on the lockfile. Must come after
          # pnpm/action-setup — setup-node needs pnpm on PATH to locate it.
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Run as separate steps rather than one `turbo run` so a failure names
      # which gate broke without anyone opening the log.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
